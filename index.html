<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIKS Fasdik - Form Verifikasi Komitmen Pendidikan</title>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.31/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --accent: #10b981;
      --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 950px; display: flex; flex-direction: column; gap: 16px; }
    header { text-align: center; }
    header h1 { font-size: 1.5rem; font-weight: 700; color: #fff; }
    header p { color: var(--text-muted); font-size: 0.85rem; margin-top: 4px; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 99px; background: rgba(56, 189, 248, 0.15); color: var(--primary); font-size: 0.72rem; font-weight: 700; margin-bottom: 8px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    .dropzone { border: 2px dashed #475569; border-radius: var(--radius); padding: 24px 16px; text-align: center; cursor: pointer; transition: 0.2s; background: rgba(15, 23, 42, 0.4); }
    .dropzone:hover, .dropzone.dragover { border-color: var(--primary); background: rgba(56, 189, 248, 0.05); }
    .dropzone svg { color: var(--primary); margin-bottom: 6px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
    select, input { background: #0f172a; border: 1px solid var(--border); border-radius: 6px; color: #fff; padding: 9px 12px; font-size: 0.85rem; outline: none; }
    select:focus, input:focus { border-color: var(--primary); }
    .stats-bar { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--text-muted); padding: 10px 14px; background: #0f172a; border: 1px solid var(--border); border-radius: 6px; margin-top: 14px; }
    .btn-group { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
    button { flex: 1; min-width: 140px; padding: 11px 16px; border-radius: 6px; border: none; font-weight: 600; font-size: 0.88rem; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-primary { background: var(--primary); color: #0f172a; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-excel { background: var(--accent); color: #fff; }
    .btn-excel:hover:not(:disabled) { opacity: 0.9; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .preview-wrap { margin-top: 16px; border: 1px solid var(--border); border-radius: 6px; overflow: auto; max-height: 240px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.75rem; text-align: left; }
    th, td { padding: 7px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { background: #0f172a; color: var(--primary); position: sticky; top: 0; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="badge">Official Form Generator</div>
    <h1>Form Verifikasi Komitmen Pendidikan</h1>
    <p>Otomasi CSV SIKS Fasdik ke Model Lembar Verifikasi Resmi (Kemensos)</p>
  </header>

  <div class="card">
    <div class="dropzone" id="dz" onclick="document.getElementById('csvFile').click()">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <p id="dzText">Pilih atau seret berkas <strong>.CSV SIKS</strong> ke sini</p>
      <input type="file" id="csvFile" accept=".csv,text/csv,text/plain" style="display:none;" />
    </div>

    <div class="stats-bar" id="statsBar" style="display:none;">
      <span>File: <strong id="statFileName" style="color:#fff;">-</strong></span>
      <span>Sekolah: <strong id="statSchools" style="color:#fff;">0</strong></span>
      <span>Siswa Valid: <strong id="statRows" style="color:#fff;">0</strong></span>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label>Ukuran Kertas</label>
        <select id="paperSize">
          <option value="f4">F4 / Folio (330 × 210 mm) - Standar</option>
          <option value="a4">A4 (297 × 210 mm)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Bulan Laporan (Triwulan)</label>
        <input type="text" id="reportMonths" value="OKTOBER, NOVEMBER, DESEMBER" />
      </div>
      <div class="form-group">
        <label>Nama Petugas Pendamping</label>
        <input type="text" id="signerName" value="Andriadi, S.Kom" placeholder="Nama Petugas" />
      </div>
      <div class="form-group">
        <label>NIP Petugas Pendamping</label>
        <input type="text" id="signerNip" value="198208042025210058" placeholder="NIP Petugas" />
      </div>
    </div>

    <div class="preview-wrap" id="previewWrap" style="display:none;">
      <table id="previewTable"></table>
    </div>

    <div class="btn-group">
      <button class="btn-primary" id="btnPdf" disabled onclick="generatePDF()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Generate PDF (Auto Split Sekolah)
      </button>
      <button class="btn-excel" id="btnExcel" disabled onclick="exportExcel()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3z"/><path d="M9 9l6 6M15 9l-6 6"/></svg>
        Ekspor Excel
      </button>
    </div>
  </div>
</div>

<script>
let groupedSchools = {};
let allRows = [];

const fileInput = document.getElementById('csvFile');
const dz = document.getElementById('dz');
const dzText = document.getElementById('dzText');
const statsBar = document.getElementById('statsBar');
const btnPdf = document.getElementById('btnPdf');
const btnExcel = document.getElementById('btnExcel');

dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('dragover'); });
dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
dz.addEventListener('drop', (e) => {
  e.preventDefault();
  dz.classList.remove('dragover');
  if (e.dataTransfer.files.length) processFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', (e) => {
  if (e.target.files.length) processFile(e.target.files[0]);
});

function processFile(file) {
  dzText.innerText = `Membaca: ${file.name}...`;
  const reader = new FileReader();
  reader.onload = (e) => parseSIKSCsv(e.target.result, file.name);
  reader.readAsText(file, 'ISO-8859-1');
}

function cleanStr(s) {
  return (s || '').toString().trim().replace(/^["']|["']$/g, '');
}

function normKey(s) {
  return cleanStr(s).toUpperCase().replace(/[^A-Z0-9]/g, '');
}

function parseSIKSCsv(text, fileName) {
  const rawLines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
  if (rawLines.length < 2) { alert('CSV kosong atau rusak.'); return; }

  const sep = (rawLines.slice(0, 15).join(' ').split(';').length > rawLines.slice(0, 15).join(' ').split(',').length) ? ';' : ',';

  let metaSchool = '', metaNpsn = '';
  for (let i = 0; i < Math.min(rawLines.length, 20); i++) {
    const lUpper = rawLines[i].toUpperCase();
    if ((lUpper.includes('SEKOLAH') || lUpper.includes('SEKOLA')) && lUpper.includes(':')) {
      const parts = rawLines[i].split(':');
      if (parts[1]) metaSchool = cleanStr(parts[1].split(sep)[0]);
    }
    if (lUpper.includes('NPSN') && lUpper.includes(':')) {
      const parts = rawLines[i].split(':');
      if (parts[1]) metaNpsn = cleanStr(parts[1].split(sep)[0]).replace(/\D/g, '');
    }
  }

  let headerIndex = -1;
  let headers = [];
  for (let i = 0; i < rawLines.length; i++) {
    const cols = rawLines[i].split(sep).map(normKey);
    if (cols.some(c => c.includes('PENGURUS')) && cols.some(c => c.includes('SISWA') || c.includes('NISN'))) {
      headerIndex = i;
      headers = rawLines[i].split(sep).map(cleanStr);
      break;
    }
  }

  if (headerIndex === -1) {
    headerIndex = 0;
    headers = rawLines[0].split(sep).map(cleanStr);
  }

  const findCol = (exactKeywords) => {
    return headers.findIndex(h => {
      const clean = normKey(h);
      return exactKeywords.some(kw => clean === normKey(kw) || clean.includes(normKey(kw)));
    });
  };

  let idxNikPengurus = findCol(['NIKPENGURUS', 'NIK_PENGURUS']);
  let idxNamaPengurus = findCol(['NAMAPENGURUS', 'NAMA_PENGURUS']);
  let idxNisn = findCol(['NISN']);
  let idxNamaSiswa = findCol(['NAMASISWA', 'NAMA_SISWA', 'NAMAANAK']);
  let idxNikSiswa = findCol(['NIKSISWA', 'NIK_SISWA']);
  let idxTingkat = findCol(['TINGKAT', 'KELAS', 'ROMBEL']);
  let idxSekolah = findCol(['NAMASEKOLAH', 'SEKOLAH']);
  let idxNpsn = findCol(['NPSN']);

  allRows = [];
  groupedSchools = {};

  for (let i = headerIndex + 1; i < rawLines.length; i++) {
    const cols = rawLines[i].split(sep).map(cleanStr);
    if (cols.length < 5) continue;

    let nikPengurus = idxNikPengurus !== -1 ? cols[idxNikPengurus] : cols[1];
    let namaPengurus = idxNamaPengurus !== -1 ? cols[idxNamaPengurus] : cols[2];
    let nisn = idxNisn !== -1 ? cols[idxNisn] : cols[4];
    let namaSiswa = idxNamaSiswa !== -1 ? cols[idxNamaSiswa] : cols[5];
    let nikSiswa = idxNikSiswa !== -1 ? cols[idxNikSiswa] : cols[6];
    let tingkat = idxTingkat !== -1 ? cols[idxTingkat] : cols[7];
    let sekolah = idxSekolah !== -1 ? cols[idxSekolah] : '';
    let npsn = idxNpsn !== -1 ? cols[idxNpsn] : '';

    if (/^\d{16}$/.test(namaPengurus) && cols[2] && !/^\d{16}$/.test(cols[2])) {
      namaPengurus = cols[2];
    }
    if (/^\d{15,16}$/.test(namaSiswa)) {
      const textCol = cols.find((c, cIdx) => cIdx > 2 && cIdx < 8 && isNaN(c) && c.length > 2);
      if (textCol) namaSiswa = textCol;
    }

    if (!sekolah && metaSchool) sekolah = metaSchool;
    if (!npsn && metaNpsn) npsn = metaNpsn;

    if (nikPengurus.startsWith('202') && nikPengurus.includes('-')) continue;
    if (namaPengurus.startsWith('202') && namaPengurus.includes('-')) continue;
    const test = normKey(namaPengurus + namaSiswa);
    if (!test || test.includes('NAMAPENGURUS') || test.includes('TINGKATPENDIDIKAN')) continue;

    const rowObj = {
      nikPengurus: nikPengurus || '-',
      pengurus: namaPengurus || '-',
      nisn: nisn || '-',
      siswa: namaSiswa || '-',
      tingkat: tingkat || '-',
      sekolah: sekolah || 'SD NEGERI 1 TUMBANG GETAS',
      npsn: npsn || '30201660'
    };

    allRows.push(rowObj);
    const sName = rowObj.sekolah;
    if (!groupedSchools[sName]) groupedSchools[sName] = [];
    groupedSchools[sName].push(rowObj);
  }

  document.getElementById('statFileName').innerText = fileName;
  document.getElementById('statSchools').innerText = Object.keys(groupedSchools).length;
  document.getElementById('statRows').innerText = allRows.length;
  statsBar.style.display = 'flex';
  dzText.innerHTML = `Berkas siap: <strong>${fileName}</strong>`;
  btnPdf.disabled = false;
  btnExcel.disabled = false;

  renderPreview();
}

function renderPreview() {
  const wrap = document.getElementById('previewWrap');
  const table = document.getElementById('previewTable');
  wrap.style.display = 'block';

  let html = `<thead><tr><th>NO</th><th>NIK PENGURUS</th><th>NAMA PENGURUS</th><th>NISN</th><th>NAMA SISWA</th><th>TINGKAT</th><th>SEKOLAH</th></tr></thead><tbody>`;
  allRows.slice(0, 5).forEach((r, i) => {
    html += `<tr><td>${i+1}</td><td>${r.nikPengurus}</td><td>${r.pengurus}</td><td>${r.nisn}</td><td>${r.siswa}</td><td>${r.tingkat}</td><td>${r.sekolah}</td></tr>`;
  });
  html += `</tbody>`;
  table.innerHTML = html;
}

// LOGO RESMI KEMENTERIAN SOSIAL (FIGUR BIRU, SAYAP DAUN HIJAU, MANGKUK KUNING)
function drawKemensosLogo(doc, x, y, size) {
  doc.saveGraphicsState();
  const s = size / 24;

  // 1. Mangkuk / Tangan Kuning Bawah
  doc.setFillColor(243, 178, 12);
  doc.lines([
    [15 * s, 10 * s],
    [-7 * s, -1 * s],
    [-8 * s, -9 * s]
  ], x + 4 * s, y + 11 * s, [1, 1], 'F', true);

  // 2. Figur Manusia Biru
  doc.setFillColor(16, 92, 168);
  doc.circle(x + 7.5 * s, y + 4.5 * s, 1.8 * s, 'F'); // Kepala
  doc.lines([
    [3.5 * s, 1.2 * s],
    [-1.2 * s, 6 * s],
    [-3.8 * s, -5 * s]
  ], x + 5 * s, y + 7 * s, [1, 1], 'F', true); // Tubuh

  // 3. Helai Sayap / Daun Hijau (3 Helai)
  doc.setFillColor(15, 142, 60);
  doc.lines([
    [7 * s, -6 * s],
    [-2 * s, 2 * s],
    [-5 * s, 4 * s]
  ], x + 8.5 * s, y + 8 * s, [1, 1], 'F', true);

  doc.lines([
    [8 * s, -4.5 * s],
    [-2.5 * s, 1.5 * s],
    [-5.5 * s, 3 * s]
  ], x + 8.5 * s, y + 10.5 * s, [1, 1], 'F', true);

  doc.lines([
    [9 * s, -3 * s],
    [-3 * s, 1 * s],
    [-6 * s, 2 * s]
  ], x + 8.5 * s, y + 13 * s, [1, 1], 'F', true);

  doc.restoreGraphicsState();
}

async function generatePDF() {
  const { jsPDF } = window.jspdf;
  const paper = document.getElementById('paperSize').value;
  const monthsInput = document.getElementById('reportMonths').value.trim();
  const signer = document.getElementById('signerName').value.trim() || 'Andriadi, S.Kom';
  const nip = document.getElementById('signerNip').value.trim();

  const mList = monthsInput ? monthsInput.split(',').map(m => m.trim().toUpperCase()) : ['OKTOBER', 'NOVEMBER', 'DESEMBER'];
  while (mList.length < 3) mList.push(`BULAN ${mList.length + 1}`);

  const pageSize = paper === 'f4' ? [330, 210] : 'a4';
  const schoolKeys = Object.keys(groupedSchools);

  if (schoolKeys.length === 1) {
    const doc = buildOfficialDoc(schoolKeys[0], groupedSchools[schoolKeys[0]], pageSize, mList, signer, nip);
    doc.save(`Form_Verifikasi_${schoolKeys[0].replace(/[^a-zA-Z0-9]/g, '_')}.pdf`);
  } else {
    btnPdf.innerText = "Membuat ZIP...";
    btnPdf.disabled = true;
    const zip = new JSZip();

    schoolKeys.forEach(sch => {
      const doc = buildOfficialDoc(sch, groupedSchools[sch], pageSize, mList, signer, nip);
      zip.file(`Form_Verifikasi_${sch.replace(/[^a-zA-Z0-9]/g, '_')}.pdf`, doc.output('blob'));
    });

    const zipBlob = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(zipBlob);
    a.download = `Form_Verifikasi_Pendidikan_${Date.now()}.zip`;
    a.click();

    btnPdf.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> Generate PDF (Auto Split Sekolah)`;
    btnPdf.disabled = false;
  }
}

function buildOfficialDoc(schoolName, list, pageSize, months, signer, nip) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: pageSize });

  list.sort((a, b) => a.tingkat.localeCompare(b.tingkat, undefined, { numeric: true }));
  const npsn = list[0].npsn || '-';

  // HEADER KEMENSOS & LOGO BARU
  drawKemensosLogo(doc, 14, 7, 15);
  doc.setFontSize(10.5);
  doc.setFont('helvetica', 'bold');
  doc.text('KEMENTERIAN SOSIAL REPUBLIK INDONESIA', 31, 11);
  doc.setFontSize(11);
  doc.text(`LEMBAR VERIFIKASI FASILITAS PENDIDIKAN (${months.join(' - ')})`, 31, 16);
  doc.setFontSize(8.5);
  doc.setFont('helvetica', 'bold');
  doc.text(`SEKOLAH: ${schoolName}   |   NPSN: ${npsn}`, 31, 21);

  doc.setLineWidth(0.4);
  doc.line(14, 24, doc.internal.pageSize.width - 14, 24);

  // HEADER TABEL BERTINGKAT (3 LEVEL)
  const headRow1 = [
    { content: 'NO', rowSpan: 3, styles: { halign: 'center', valign: 'middle' } },
    { content: 'NIK PENGURUS', rowSpan: 3, styles: { halign: 'center', valign: 'middle' } },
    { content: 'NAMA PENGURUS', rowSpan: 3, styles: { halign: 'center', valign: 'middle' } },
    { content: 'NISN', rowSpan: 3, styles: { halign: 'center', valign: 'middle' } },
    { content: 'NAMA SISWA', rowSpan: 3, styles: { halign: 'center', valign: 'middle' } },
    { content: 'TINGKAT', rowSpan: 3, styles: { halign: 'center', valign: 'middle' } },
    { content: months[0], colSpan: 5, styles: { halign: 'center', valign: 'middle' } },
    { content: months[1], colSpan: 5, styles: { halign: 'center', valign: 'middle' } },
    { content: months[2], colSpan: 5, styles: { halign: 'center', valign: 'middle' } },
    { content: 'NAMA PENDAMPING', rowSpan: 3, styles: { halign: 'center', valign: 'middle' } }
  ];

  const headRow2 = [
    { content: 'Hari Efektif: ......', colSpan: 5, styles: { halign: 'center', valign: 'middle', fontSize: 6.5 } },
    { content: 'Hari Efektif: ......', colSpan: 5, styles: { halign: 'center', valign: 'middle', fontSize: 6.5 } },
    { content: 'Hari Efektif: ......', colSpan: 5, styles: { halign: 'center', valign: 'middle', fontSize: 6.5 } }
  ];

  const headRow3 = [
    { content: 'ALPA', styles: { halign: 'center', fontSize: 5.5 } },
    { content: 'IZIN', styles: { halign: 'center', fontSize: 5.5 } },
    { content: 'SAKIT', styles: { halign: 'center', fontSize: 5.5 } },
    { content: 'JML', styles: { halign: 'center', fontSize: 5.5 } },
    { content: '%', styles: { halign: 'center', fontSize: 5.5 } },

    { content: 'ALPA', styles: { halign: 'center', fontSize: 5.5 } },
    { content: 'IZIN', styles: { halign: 'center', fontSize: 5.5 } },
    { content: 'SAKIT', styles: { halign: 'center', fontSize: 5.5 } },
    { content: 'JML', styles: { halign: 'center', fontSize: 5.5 } },
    { content: '%', styles: { halign: 'center', fontSize: 5.5 } },

    { content: 'ALPA', styles: { halign: 'center', fontSize: 5.5 } },
    { content: 'IZIN', styles: { halign: 'center', fontSize: 5.5 } },
    { content: 'SAKIT', styles: { halign: 'center', fontSize: 5.5 } },
    { content: 'JML', styles: { halign: 'center', fontSize: 5.5 } },
    { content: '%', styles: { halign: 'center', fontSize: 5.5 } }
  ];

  const body = list.map((r, i) => [
    i + 1,
    r.nikPengurus,
    r.pengurus,
    r.nisn,
    r.siswa,
    r.tingkat,
    '', '', '', '', '',
    '', '', '', '', '',
    '', '', '', '', '',
    signer
  ]);

  const colStyles = {
    0: { cellWidth: 8, halign: 'center' },
    1: { cellWidth: 28, halign: 'center' },
    2: { cellWidth: 'auto' },
    3: { cellWidth: 22, halign: 'center' },
    4: { cellWidth: 'auto' },
    5: { cellWidth: 16, halign: 'center' },
    6:  { cellWidth: 8.5, halign: 'center' }, 7:  { cellWidth: 8.5, halign: 'center' }, 8:  { cellWidth: 8.5, halign: 'center' }, 9:  { cellWidth: 8.5, halign: 'center' }, 10: { cellWidth: 7.5, halign: 'center' },
    11: { cellWidth: 8.5, halign: 'center' }, 12: { cellWidth: 8.5, halign: 'center' }, 13: { cellWidth: 8.5, halign: 'center' }, 14: { cellWidth: 8.5, halign: 'center' }, 15: { cellWidth: 7.5, halign: 'center' },
    16: { cellWidth: 8.5, halign: 'center' }, 17: { cellWidth: 8.5, halign: 'center' }, 18: { cellWidth: 8.5, halign: 'center' }, 19: { cellWidth: 8.5, halign: 'center' }, 20: { cellWidth: 7.5, halign: 'center' },
    21: { cellWidth: 28, halign: 'center' }
  };

  doc.autoTable({
    startY: 26,
    head: [headRow1, headRow2, headRow3],
    body: body,
    theme: 'plain',
    tableLineColor: [0, 0, 0],
    tableLineWidth: 0.25,
    styles: { fontSize: 7, cellPadding: 1.5, lineColor: [0, 0, 0], lineWidth: 0.2, textColor: [0, 0, 0] },
    headStyles: { fillColor: [255, 255, 255], textColor: [0, 0, 0], fontStyle: 'bold', lineColor: [0, 0, 0], lineWidth: 0.25 },
    columnStyles: colStyles,
    didDrawPage: (data) => {
      const total = doc.internal.getNumberOfPages();
      doc.setFontSize(7.5);
      doc.setFont('helvetica', 'normal');
      doc.text(`Hal. ${total}`, doc.internal.pageSize.width - 20, doc.internal.pageSize.height - 5);
    }
  });

  // TANDA TANGAN DI BAWAH (SEJAJAR KEPALA SEKOLAH & PETUGAS)
  const finalY = doc.lastAutoTable.finalY || 140;
  const pageH = doc.internal.pageSize.height;
  if (finalY + 34 > pageH) doc.addPage();

  const yPos = finalY + 34 > pageH ? 22 : finalY + 10;
  const xLeft = 25;
  const xRight = doc.internal.pageSize.width - 75;

  doc.setFontSize(8.5);
  doc.setFont('helvetica', 'normal');

  // Sisi Kiri: Pihak Sekolah
  doc.text('Mengetahui,', xLeft, yPos);
  doc.text(`Kepala ${schoolName}`, xLeft, yPos + 4);
  doc.text('( .................................................... )', xLeft, yPos + 22);
  doc.text('NIP. .............................................', xLeft, yPos + 26);

  // Sisi Kanan: Petugas Verifikasi (Tanpa Titik Mangsa / Tanggal)
  doc.text('Petugas Verifikasi,', xRight, yPos + 4);
  doc.setFont('helvetica', 'bold');
  doc.text(signer, xRight, yPos + 22);
  if (nip) {
    doc.setFont('helvetica', 'normal');
    doc.text(`NIP. ${nip}`, xRight, yPos + 26);
  }

  return doc;
}

function exportExcel() {
  const wb = XLSX.utils.book_new();
  Object.keys(groupedSchools).forEach(sch => {
    const cleanRows = groupedSchools[sch].map((r, i) => ({
      "NO": i + 1,
      "NIK PENGURUS": r.nikPengurus,
      "NAMA PENGURUS": r.pengurus,
      "NISN": r.nisn,
      "NAMA SISWA": r.siswa,
      "TINGKAT": r.tingkat,
      "SEKOLAH": r.sekolah,
      "NPSN": r.npsn
    }));
    const ws = XLSX.utils.json_to_sheet(cleanRows);
    const sheetName = sch.substring(0, 30).replace(/[:\\\/\?\*\[\]]/g, '');
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  });
  XLSX.writeFile(wb, `Form_Verifikasi_${Date.now()}.xlsx`);
}
</script>
