<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generator SIKS Fasdik to PDF & Excel</title>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.5.31/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --accent: #10b981;
      --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 940px; display: flex; flex-direction: column; gap: 18px; }
    header { text-align: center; }
    header h1 { font-size: 1.6rem; font-weight: 700; color: #fff; }
    header p { color: var(--text-muted); font-size: 0.88rem; margin-top: 4px; }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 99px; background: rgba(56, 189, 248, 0.15); color: var(--primary); font-size: 0.72rem; font-weight: 700; margin-bottom: 8px; }
    .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
    .dropzone { border: 2px dashed #475569; border-radius: var(--radius); padding: 26px 16px; text-align: center; cursor: pointer; transition: 0.2s; background: rgba(15, 23, 42, 0.4); }
    .dropzone:hover, .dropzone.dragover { border-color: var(--primary); background: rgba(56, 189, 248, 0.05); }
    .dropzone svg { color: var(--primary); margin-bottom: 6px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-top: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }
    select, input { background: #0f172a; border: 1px solid var(--border); border-radius: 6px; color: #fff; padding: 9px 12px; font-size: 0.85rem; outline: none; }
    select:focus, input:focus { border-color: var(--primary); }
    .stats-bar { display: flex; justify-content: space-between; font-size: 0.82rem; color: var(--text-muted); padding: 10px 14px; background: #0f172a; border: 1px solid var(--border); border-radius: 6px; margin-top: 14px; }
    .btn-group { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
    button { flex: 1; min-width: 140px; padding: 11px 16px; border-radius: 6px; border: none; font-weight: 600; font-size: 0.88rem; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
    .btn-primary { background: var(--primary); color: #0f172a; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-excel { background: var(--accent); color: #fff; }
    .btn-excel:hover:not(:disabled) { opacity: 0.9; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .preview-wrap { margin-top: 16px; border: 1px solid var(--border); border-radius: 6px; overflow: auto; max-height: 250px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.78rem; text-align: left; }
    th, td { padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
    th { background: #0f172a; color: var(--primary); position: sticky; top: 0; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="badge">Engine Kemensos Edition</div>
    <h1>SIKS Fasdik Report Generator</h1>
    <p>Otomasi CSV SIKS Fasdik ke Lembar Verifikasi PDF Landscape &amp; Excel</p>
  </header>

  <div class="card">
    <div class="dropzone" id="dz" onclick="document.getElementById('csvFile').click()">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
      <p id="dzText">Pilih atau seret berkas <strong>.CSV SIKS</strong> ke sini</p>
      <input type="file" id="csvFile" accept=".csv,text/csv,text/plain" style="display:none;" />
    </div>

    <div class="stats-bar" id="statsBar" style="display:none;">
      <span>File: <strong id="statFileName" style="color:#fff;">-</strong></span>
      <span>Sekolah: <strong id="statSchools" style="color:#fff;">0</strong></span>
      <span>Siswa Valid: <strong id="statRows" style="color:#fff;">0</strong></span>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label>Ukuran Kertas</label>
        <select id="paperSize">
          <option value="f4">F4 / Folio (330 × 210 mm) - Standar</option>
          <option value="a4">A4 (297 × 210 mm)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Format Mode</label>
        <select id="reportMode">
          <option value="triwulan">Triwulan (3 Kolom Paraf, Tanpa NIK Siswa)</option>
          <option value="perbulan">Bulanan (Sertakan NIK Siswa)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Bulan Laporan (Kolom Paraf)</label>
        <input type="text" id="reportMonths" value="OKTOBER, NOVEMBER, DESEMBER" placeholder="Contoh: OKTOBER, NOVEMBER, DESEMBER" />
      </div>
      <div class="form-group">
        <label>Nama Petugas Pendamping</label>
        <input type="text" id="signerName" placeholder="Nama Lengkap & Gelar" />
      </div>
      <div class="form-group">
        <label>NIP Petugas</label>
        <input type="text" id="signerNip" placeholder="18 Digit NIP (Opsional)" />
      </div>
    </div>

    <div class="preview-wrap" id="previewWrap" style="display:none;">
      <table id="previewTable"></table>
    </div>

    <div class="btn-group">
      <button class="btn-primary" id="btnPdf" disabled onclick="generatePDF()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Generate PDF
      </button>
      <button class="btn-excel" id="btnExcel" disabled onclick="exportExcel()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3h18v18H3z"/><path d="M9 9l6 6M15 9l-6 6"/></svg>
        Ekspor Excel
      </button>
    </div>
  </div>
</div>

<script>
let groupedSchools = {};
let allRows = [];

const fileInput = document.getElementById('csvFile');
const dz = document.getElementById('dz');
const dzText = document.getElementById('dzText');
const statsBar = document.getElementById('statsBar');
const btnPdf = document.getElementById('btnPdf');
const btnExcel = document.getElementById('btnExcel');

// File Drag & Drop
dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('dragover'); });
dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
dz.addEventListener('drop', (e) => {
  e.preventDefault();
  dz.classList.remove('dragover');
  if (e.dataTransfer.files.length) processFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', (e) => {
  if (e.target.files.length) processFile(e.target.files[0]);
});

function processFile(file) {
  dzText.innerText = `Membaca berkas: ${file.name}...`;
  const reader = new FileReader();
  reader.onload = (e) => parseSIKSCsv(e.target.result, file.name);
  reader.readAsText(file, 'ISO-8859-1');
}

function cleanStr(s) {
  if (!s) return '';
  return s.toString().trim().replace(/^["']|["']$/g, '');
}

function normKey(s) {
  return cleanStr(s).toUpperCase().replace(/[^A-Z0-9]/g, '');
}

function parseSIKSCsv(text, fileName) {
  const rawLines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
  if (rawLines.length < 2) { alert('CSV kosong atau rusak.'); return; }

  const firstLines = rawLines.slice(0, 15).join(' ');
  const sep = (firstLines.split(';').length > firstLines.split(',').length) ? ';' : ',';

  // Ekstrak metadata Sekolah / NPSN jika tertulis di bagian atas
  let metaSchool = '';
  let metaNpsn = '';

  for (let i = 0; i < Math.min(rawLines.length, 12); i++) {
    const lUpper = rawLines[i].toUpperCase();
    if (lUpper.includes('SEKOLAH') && (lUpper.includes(':') || lUpper.includes(sep))) {
      const parts = rawLines[i].split(/[:;]/);
      if (parts.length > 1 && parts[1].trim().length > 3) metaSchool = cleanStr(parts[1]);
    }
    if (lUpper.includes('NPSN') && (lUpper.includes(':') || lUpper.includes(sep))) {
      const parts = rawLines[i].split(/[:;]/);
      if (parts.length > 1) metaNpsn = cleanStr(parts[1]).replace(/\D/g, '');
    }
  }

  // Scan baris header tabel
  let headerIndex = -1;
  let headers = [];

  for (let i = 0; i < rawLines.length; i++) {
    const cols = rawLines[i].split(sep).map(normKey);
    const hasPengurus = cols.some(c => c.includes('PENGURUS') || c.includes('ORANGTUA'));
    const hasSiswa = cols.some(c => c.includes('SISWA') || c.includes('ANAK') || c.includes('NISN'));

    if (hasPengurus && hasSiswa) {
      headerIndex = i;
      headers = rawLines[i].split(sep).map(cleanStr);
      break;
    }
  }

  if (headerIndex === -1) {
    headerIndex = 0;
    headers = rawLines[0].split(sep).map(cleanStr);
  }

  const findIndex = (keywords) => {
    return headers.findIndex(h => {
      const k = normKey(h);
      return keywords.some(kw => k.includes(normKey(kw)));
    });
  };

  const colIdx = {
    nikPengurus: findIndex(['NIKPENGURUS', 'NOKTP']),
    pengurus: findIndex(['NAMAPENGURUS', 'PENGURUS', 'ORANGTUA']),
    nisn: findIndex(['NISN', 'NOMORINDUK']),
    siswa: findIndex(['NAMASISWA', 'NAMAANAK', 'SISWA']),
    nikSiswa: findIndex(['NIKSISWA', 'NIKANAK']),
    tingkat: findIndex(['TINGKAT', 'KELAS', 'ROMBEL']),
    sekolah: findIndex(['NAMASEKOLAH', 'SEKOLAH', 'LEMBAGA']),
    npsn: findIndex(['NPSN'])
  };

  allRows = [];
  groupedSchools = {};

  for (let i = headerIndex + 1; i < rawLines.length; i++) {
    const line = rawLines[i];
    if (!line) continue;

    const cols = line.split(sep).map(cleanStr);

    const nikPengurus = colIdx.nikPengurus !== -1 ? cols[colIdx.nikPengurus] : (cols[1] || '');
    const pengurus = colIdx.pengurus !== -1 ? cols[colIdx.pengurus] : (cols[2] || '');
    const nisn = colIdx.nisn !== -1 ? cols[colIdx.nisn] : (cols[4] || '');
    const siswa = colIdx.siswa !== -1 ? cols[colIdx.siswa] : (cols[5] || '');
    const nikSiswa = colIdx.nikSiswa !== -1 ? cols[colIdx.nikSiswa] : (cols[6] || '');
    const tingkat = colIdx.tingkat !== -1 ? cols[colIdx.tingkat] : (cols[7] || '');
    let sekolah = colIdx.sekolah !== -1 ? cols[colIdx.sekolah] : '';
    let npsn = colIdx.npsn !== -1 ? cols[colIdx.npsn] : '';

    if (!sekolah && metaSchool) sekolah = metaSchool;
    if (!npsn && metaNpsn) npsn = metaNpsn;

    // Filter baris kosong & baris header yang berulang
    const checkStr = normKey(pengurus + siswa + nisn);
    if (!checkStr) continue;
    if (checkStr.includes('NAMAPENGURUS') || checkStr.includes('TINGKATPENDIDIKAN') || checkStr.includes('NISN')) {
      continue;
    }

    const rowObj = {
      nikPengurus: nikPengurus || '-',
      pengurus: pengurus || '-',
      nisn: nisn || '-',
      siswa: siswa || '-',
      nikSiswa: nikSiswa || '-',
      tingkat: tingkat || '-',
      sekolah: sekolah || 'SEKOLAH',
      npsn: npsn || '-'
    };

    allRows.push(rowObj);

    const schKey = rowObj.sekolah;
    if (!groupedSchools[schKey]) groupedSchools[schKey] = [];
    groupedSchools[schKey].push(rowObj);
  }

  // Update Statistik UI
  document.getElementById('statFileName').innerText = fileName;
  document.getElementById('statSchools').innerText = Object.keys(groupedSchools).length;
  document.getElementById('statRows').innerText = allRows.length;
  statsBar.style.display = 'flex';
  dzText.innerHTML = `Berkas siap: <strong>${fileName}</strong>`;
  btnPdf.disabled = false;
  btnExcel.disabled = false;

  renderPreview();
}

function renderPreview() {
  const wrap = document.getElementById('previewWrap');
  const table = document.getElementById('previewTable');
  wrap.style.display = 'block';

  let html = `<thead><tr><th>NO</th><th>NIK PENGURUS</th><th>NAMA PENGURUS</th><th>NISN</th><th>NAMA SISWA</th><th>TINGKAT</th><th>SEKOLAH</th></tr></thead><tbody>`;
  allRows.slice(0, 5).forEach((r, i) => {
    html += `<tr><td>${i+1}</td><td>${r.nikPengurus}</td><td>${r.pengurus}</td><td>${r.nisn}</td><td>${r.siswa}</td><td>${r.tingkat}</td><td>${r.sekolah}</td></tr>`;
  });
  html += `</tbody>`;
  table.innerHTML = html;
}

// Fungsi Menggambar Logo Vektor Resmi Kemensos langsung di PDF
function drawKemensosLogo(doc, x, y, size) {
  doc.saveGraphicsState();
  
  // Lingkaran Dasar Biru Tua Khas Kemensos
  doc.setFillColor(15, 60, 130);
  doc.circle(x + size / 2, y + size / 2, size / 2, 'F');

  // Sayap / Pita Kuning Emas
  doc.setFillColor(245, 180, 20);
  doc.ellipse(x + size / 2, y + size * 0.45, size * 0.38, size * 0.16, 'F');

  // Daun / Kelopak Hijau Kesejahteraan
  doc.setFillColor(35, 155, 60);
  doc.circle(x + size * 0.35, y + size * 0.65, size * 0.12, 'F');
  doc.circle(x + size * 0.65, y + size * 0.65, size * 0.12, 'F');

  // Bunga / Inti Merah Putih Tengah
  doc.setFillColor(220, 35, 35);
  doc.circle(x + size / 2, y + size * 0.52, size * 0.14, 'F');
  doc.setFillColor(255, 255, 255);
  doc.circle(x + size / 2, y + size * 0.52, size * 0.07, 'F');

  doc.restoreGraphicsState();
}

async function generatePDF() {
  const { jsPDF } = window.jspdf;
  const paper = document.getElementById('paperSize').value;
  const mode = document.getElementById('reportMode').value;
  const monthsInput = document.getElementById('reportMonths').value.trim();
  const signer = document.getElementById('signerName').value.trim();
  const nip = document.getElementById('signerNip').value.trim();

  const monthList = monthsInput ? monthsInput.split(',').map(m => m.trim().toUpperCase()) : ['BULAN 1', 'BULAN 2', 'BULAN 3'];
  while (monthList.length < 3) monthList.push(`BULAN ${monthList.length + 1}`);

  const pageSize = paper === 'f4' ? [330, 210] : 'a4';
  const schoolKeys = Object.keys(groupedSchools);

  if (schoolKeys.length === 1) {
    const doc = makeSchoolDoc(schoolKeys[0], groupedSchools[schoolKeys[0]], pageSize, mode, monthList, signer, nip);
    doc.save(`Verifikasi_${schoolKeys[0].replace(/[^a-zA-Z0-9]/g, '_')}.pdf`);
  } else {
    btnPdf.innerText = "Membuat ZIP...";
    btnPdf.disabled = true;
    const zip = new JSZip();

    schoolKeys.forEach(sch => {
      const doc = makeSchoolDoc(sch, groupedSchools[sch], pageSize, mode, monthList, signer, nip);
      zip.file(`Verifikasi_${sch.replace(/[^a-zA-Z0-9]/g, '_')}.pdf`, doc.output('blob'));
    });

    const zipBlob = await zip.generateAsync({ type: 'blob' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(zipBlob);
    a.download = `Laporan_Fasdik_${Date.now()}.zip`;
    a.click();

    btnPdf.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> Generate PDF`;
    btnPdf.disabled = false;
  }
}

function makeSchoolDoc(schoolName, list, pageSize, mode, months, signer, nip) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: pageSize });

  // Urutkan kelas secara natural
  list.sort((a, b) => a.tingkat.localeCompare(b.tingkat, undefined, { numeric: true }));
  const npsn = list[0].npsn || '-';

  // Susun data tabel
  const body = list.map((r, i) => {
    let row = [i + 1, r.nikPengurus, r.pengurus, r.nisn, r.siswa];
    if (mode === 'perbulan') row.push(r.nikSiswa);
    row.push(r.tingkat, '', '', '');
    return row;
  });

  let head = ['NO', 'NIK PENGURUS', 'NAMA PENGURUS', 'NISN', 'NAMA SISWA'];
  if (mode === 'perbulan') head.push('NIK SISWA');
  head.push('TINGKAT', months[0], months[1], months[2]);

  // Gambar Kop Surat Kemensos
  drawKemensosLogo(doc, 14, 8, 14);

  doc.setFontSize(10);
  doc.setFont('helvetica', 'bold');
  doc.text('KEMENTERIAN SOSIAL REPUBLIK INDONESIA', 31, 12);
  doc.setFontSize(11);
  doc.text(`LEMBAR VERIFIKASI FASILITAS PENDIDIKAN (${months.join(' - ')})`, 31, 17);
  doc.setFontSize(8.5);
  doc.setFont('helvetica', 'normal');
  doc.text(`SEKOLAH: ${schoolName}     |     NPSN: ${npsn}`, 31, 22);

  // Garis Pemisah Kop
  doc.setLineWidth(0.4);
  doc.line(14, 25, doc.internal.pageSize.width - 14, 25);

  let colStyles = {
    0: { cellWidth: 8, halign: 'center' },   // NO
    1: { cellWidth: 32, halign: 'center' },  // NIK PENGURUS
    2: { cellWidth: 'auto' },                // NAMA PENGURUS
    3: { cellWidth: 24, halign: 'center' },  // NISN
    4: { cellWidth: 'auto' },                // NAMA SISWA
    [head.length - 4]: { cellWidth: 20, halign: 'center' }, // TINGKAT
    [head.length - 3]: { cellWidth: 20, halign: 'center' }, // BLN 1
    [head.length - 2]: { cellWidth: 20, halign: 'center' }, // BLN 2
    [head.length - 1]: { cellWidth: 20, halign: 'center' }  // BLN 3
  };

  doc.autoTable({
    startY: 28,
    head: [head],
    body: body,
    theme: 'grid',
    styles: { fontSize: 7.5, cellPadding: 2, lineColor: [160, 160, 160], lineWidth: 0.2 },
    headStyles: { fillColor: [240, 240, 240], textColor: [20, 20, 20], fontStyle: 'bold', halign: 'center' },
    columnStyles: colStyles,
    didDrawPage: (data) => {
      // Header ulang di lembar berikutnya jika halaman > 1
      if (doc.internal.getNumberOfPages() > 1) {
        drawKemensosLogo(doc, 14, 6, 10);
        doc.setFontSize(8);
        doc.setFont('helvetica', 'bold');
        doc.text(`LEMBAR VERIFIKASI FASILITAS PENDIDIKAN - ${schoolName}`, 27, 12);
      }
      // Footer Nomor Halaman
      const total = doc.internal.getNumberOfPages();
      doc.setFontSize(7.5);
      doc.setFont('helvetica', 'normal');
      doc.text(`Halaman ${total}`, doc.internal.pageSize.width - 20, doc.internal.pageSize.height - 6);
    }
  });

  // Tanda Tangan Pendamping & NIP
  if (signer) {
    const finalY = doc.lastAutoTable.finalY || 150;
    const pageH = doc.internal.pageSize.height;
    if (finalY + 34 > pageH) doc.addPage();

    const yPos = finalY + 34 > pageH ? 22 : finalY + 8;
    const xPos = doc.internal.pageSize.width - 75;

    doc.setFontSize(8.5);
    doc.setFont('helvetica', 'normal');
    doc.text('Petugas Verifikasi,', xPos, yPos);
    doc.setFont('helvetica', 'bold');
    doc.text(signer, xPos, yPos + 18);
    if (nip) {
      doc.setFont('helvetica', 'normal');
      doc.text(`NIP. ${nip}`, xPos, yPos + 22);
    }
  }

  return doc;
}

function exportExcel() {
  const wb = XLSX.utils.book_new();
  Object.keys(groupedSchools).forEach(sch => {
    const cleanRows = groupedSchools[sch].map((r, i) => ({
      "NO": i + 1,
      "NIK PENGURUS": r.nikPengurus,
      "NAMA PENGURUS": r.pengurus,
      "NISN": r.nisn,
      "NAMA SISWA": r.siswa,
      "NIK SISWA": r.nikSiswa,
      "TINGKAT": r.tingkat,
      "SEKOLAH": r.sekolah,
      "NPSN": r.npsn
    }));
    const ws = XLSX.utils.json_to_sheet(cleanRows);
    const sheetName = sch.substring(0, 30).replace(/[:\\\/\?\*\[\]]/g, '');
    XLSX.utils.book_append_sheet(wb, ws, sheetName);
  });
  XLSX.writeFile(wb, `Verifikasi_SIKS_${Date.now()}.xlsx`);
}
</script>
</body>
</html>
