name = "verkom"
main = "worker.js"
compatibility_date = "2026-10-13"

# Sajikan file statis (index.html, sw.js, manifest.json) dari folder public/
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
